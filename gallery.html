<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — PSquare Art Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html"><img src="images/logo.jpg" alt="PSquare Art Gallery"></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="artists.html">Artists</a></li>
      <li><a href="exhibition.html">Exhibition</a></li>
      <li><a href="tickets.html">Tickets</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="auth.html" class="nav-auth-link">Login</a></li>
    </ul>
    <a href="cart.html" class="cart-nav-link">🛒 <span class="cart-badge">0</span></a>
  </nav>
  <div class="page-container">
    <div class="page-header">
      <h1>The Collection</h1>
      <p class="ornament">✦ ✦ ✦</p>
      <p>All artworks served from our local MySQL database via PHP &amp; AJAX</p>
    </div>
    <div class="gallery-controls">
      <input type="text" id="searchInput" class="search-box"
             placeholder="Search by title, artist, year, medium…"
             oninput="searchArt()" autocomplete="off">
      <select id="categoryFilter" class="filter-select" onchange="searchArt()">
        <option value="all">All Categories</option>
        <option value="Renaissance">Renaissance</option>
        <option value="Post-Impressionism">Post-Impressionism</option>
        <option value="Dutch Golden Age">Dutch Golden Age</option>
        <option value="Historical Portrait">Historical Portrait</option>
        <option value="Impressionism">Impressionism</option>
        <option value="Surrealism">Surrealism</option>
      </select>
      <select id="yearFilter" class="filter-select" onchange="searchArt()">
        <option value="all">All Periods</option>
        <option value="before1700">Before 1700</option>
        <option value="1700to1900">1700 – 1900</option>
        <option value="after1900">After 1900</option>
      </select>
      <span class="result-count" id="resultCount">Loading…</span>
    </div>
    <div class="gallery-grid" id="galleryGrid">
      <div class="loading-indicator" style="grid-column:1/-1">
        Loading from database<span class="loading-dots"></span>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/jquery-features.js"></script>
</body>
</html>
