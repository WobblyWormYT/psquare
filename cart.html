<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — PSquare Art Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html"><img src="images/logo.jpg" alt="PSquare Art Gallery"></a></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="artists.html">Artists</a></li>
      <li><a href="exhibition.html">Exhibition</a></li>
      <li><a href="tickets.html">Tickets</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="auth.html" class="nav-auth-link">Login</a></li>
    </ul>
    <a href="cart.html" class="cart-nav-link">🛒 <span class="cart-badge">0</span></a>
  </nav>
  <div class="page-container">
    <div class="page-header">
      <h1>Your Cart</h1>
      <p class="ornament">✦ ✦ ✦</p>
      <p>Fine art prints, ready for your walls</p>
    </div>
    <div class="cart-layout">
      <div>
        <div class="section-divider"><span id="cartCount">0 items</span></div>
        <div id="cartItems"></div>
      </div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Print Type</span><span>Fine Art (A3)</span></div>
        <div class="summary-row"><span>Printing</span><span>300 dpi Giclée</span></div>
        <div class="summary-row"><span>Shipping</span><span>Free (India)</span></div>
        <div class="summary-total">
          <span>Total</span>
          <strong id="cartTotal">₹0</strong>
        </div>
        <button class="btn btn-primary" id="checkoutBtn" onclick="checkoutCart()"
                style="width:100%;margin-top:20px;padding:14px;">Proceed to Checkout</button>
        <a href="gallery.html" class="btn" style="width:100%;margin-top:10px;padding:14px;display:block;text-align:center;">Continue Browsing</a>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/jquery-features.js"></script>
</body>
</html>
